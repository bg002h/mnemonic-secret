[package]
name = "ms-cli"
version = "0.21.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Companion CLI for ms-codec — engrave-friendly BIP-39 entropy backups (the ms1 format)."
documentation = "https://docs.rs/ms-cli"
readme = "README.md"
keywords = ["bitcoin", "codex32", "bip93", "bip39", "engraving"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[[bin]]
name = "ms"
path = "src/main.rs"

[dependencies]
ms-codec = { path = "../ms-codec", version = "=0.10.1" }
# THE SHARED IO MECHANISM (P2), from crates.io. mnemonic-io-lib 0.1.3 was
# published from mnemonic-engrave 12adba30 (tag mnemonic-io-lib-v0.1.3), so a
# clean checkout (freebsd-compile-gate, both musl-check targets) resolves it with
# no sibling repository and no git source (Brian 2026-11-24). 0.1.3 writes through
# a temp file and a rename, so a failed write leaves the old file as it was, and
# adds `same_file`. It must carry the four items P2 adopts: `fd::mode_of`,
# `remedy::history_purge_block`, `remedy::history_purge_recipes`,
# `write::write_private`; `tests/crate_items_resolve.rs` goes RED if not.
mnemonic-io-lib = "0.1.3"
bip39 = { version = "2", features = ["all-languages"] }
bitcoin = "0.32"
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# codex32 is vendored inside ms-codec (Cycle-B, shape A); tests reach it via the
# `ms_codec::codex32::` re-export — no separate codex32 dep.
