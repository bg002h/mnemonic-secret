name: rust

# Cycle B PE — first Rust CI workflow for ms-cli. Mirrors the toolkit's
# `.github/workflows/rust.yml` (Phase 2 + 3a) per Cycle B SPEC §6 G3
# (Ubuntu + macOS platform coverage) and §6 G4.b (Miri on mlock's unsafe
# blocks). Wave-3 (ms-codec-no-ci-workflow) extended this single workflow
# with the repo-wide `fmt` (pinned 1.95.0) gate plus `test-ms-codec` /
# `clippy-ms-codec` jobs — ms-codec previously had NO CI of any kind — and
# widened the path filter to `crates/ms-codec/**` so those jobs fire.
#
# ms-cli is a binary-only crate (`[[bin]] name = "ms"`) — the `mlock`
# module is binary-private (declared via `mod mlock;` in `main.rs`).
# Test invocations target the binary's test build, NOT a `--lib` target.
#
# Security note: this workflow uses only GitHub-provided trusted context
# (matrix.os, runner.os). No interpolation of untrusted user input
# (issue/PR titles, commit messages, etc.).

on:
  push:
    branches: [main, master, 'ci/**']
    # NO paths on push either, as of 2026-08-15 — this now MIRRORS the PR
    # trigger below, and for the same reason one step further along.
    #
    # The filter's stated rationale was "docs-only direct pushes to master are
    # covered by admin bypass (enforce_admins:false)". That is TRUE FOR THE
    # MAINTAINER and remains so — the bypass is their deliberate escape hatch,
    # ruled 2026-08-15: "You are not permitted to bypass, but I am."
    #
    # It is false for AUTOMATION, which may not bypass. A path-filtered push
    # wedges an agent exactly as it would wedge a docs-only PR: the staged SHA
    # never builds, never earns its four required contexts, and the agent has no
    # compliant way to land the commit. The same argument the PR side already
    # accepted therefore applies here, so the same answer is used. Running the
    # full matrix on a docs-only push is green (unchanged code).
    #
    # WHY ci/** IS BUILT. A required status check binds to a COMMIT SHA, not to
    # a branch, so a commit pushed straight to master carries no check when the
    # protection rule is evaluated: it reports "expected" and the push is
    # BYPASSED rather than satisfied. `strict: false` makes it fixable — GitHub
    # asks only whether the commit carries a passing context, so the SHA earns
    # one first:
    #
    #     git push origin master:refs/heads/ci/staging
    #     gh run watch <id> --repo bg002h/mnemonic-secret
    #     git push origin master        # no bypass message = satisfied
    #     git push origin --delete ci/staging
  pull_request:
    # NO paths — this workflow's test/clippy contexts are REQUIRED status
    # checks (branch protection), and a path-filtered required check wedges a
    # docs-only PR forever at "Expected — waiting for status" (mirror the
    # toolkit examples.yml/rust.yml ruling). Running the full matrix on a
    # docs-only PR is green (unchanged code).

jobs:
  # Dedicated rustfmt gate, pinned to a CANONICAL formatter version (1.95.0,
  # matching the toolkit's CI + mnemonic-key). rustfmt output drifts between
  # toolchain releases, so the FORMATTER is pinned independently of the build
  # MSRV: bump it DELIBERATELY (install the new version + re-run `cargo +<new>
  # fmt --all` in the SAME commit). The explicit `+1.95.0` is REQUIRED here —
  # this repo's `rust-toolchain.toml` pins 1.85.0, which a bare `cargo fmt`
  # would otherwise use (and which formats differently). The whole workspace
  # (ms-codec + ms-cli) was reformatted to 1.95.0 in the standalone chore(fmt)
  # commit that immediately precedes this CI commit.
  #
  # THE mlock.rs EXEMPTION IS GONE, as of 2026-08-15. This note records why, so
  # nobody reintroduces it.
  #
  # `crates/ms-cli/src/mlock.rs` USED to be the one file excluded here. It is
  # byte-synced cross-repo with `crates/mnemonic-toolkit/src/mlock.rs` under the
  # `g6` invariant, and while the pinned ms-cli tag's copy was unformatted this
  # gate and g6 pulled in opposite directions, so the file was exempted.
  #
  # THE EXEMPTION WAS THE HAZARD, not the protection. It was enforced only in CI
  # and reproducible by no local command, so a bare `cargo fmt --all` re-wrapped
  # the file and broke g6 — which is exactly what happened on 2026-08-15
  # (de593ca), leaving master red until it was reverted (2ebea45). That commit
  # explained itself as fixing a fmt gate the repo was "failing"; it was not
  # failing, the exemption was working, and no local tool could say so. An
  # exemption only CI knows about is a trap for every future contributor,
  # including the ones who read the comment and still run the obvious command.
  #
  # The g6 pin is now `ms-cli-v0.16.0`, whose copy IS 1.95.0-formatted (d49d5c0
  # here), and mnemonic-toolkit formatted its copy to match in the same commit
  # that bumped the pin (its 27a68e9f). Both sides are now produced by the SAME
  # pinned formatter, so the formatter PRODUCES the byte-equality g6 checks
  # instead of threatening it. There is nothing left to exempt, and
  # `cargo fmt --all` is now simply the correct thing to run.
  #
  # If a future ms-cli pin regresses to an unformatted tag, fix the TAG. Do not
  # bring the exemption back.
  fmt:
    name: fmt (pinned 1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0 (canonical fmt toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Rustfmt (pinned 1.95.0, overriding rust-toolchain.toml)
        # Whole workspace, no exclusions, plain exit code. `--all` handles each
        # crate's edition automatically. mlock.rs is included like every other
        # file now that both sides of the g6 invariant are formatted by this
        # same pinned formatter.
        run: cargo +1.95.0 fmt --all -- --check

  test-ms-codec:
    # ms-codec is a pure lib crate (no mlock, no ulimit dance, no FAIL_MODE
    # matrix, no platform-specific code) — single Linux runner is sufficient.
    # This is the FIRST CI coverage for ms-codec (burns down the
    # ms-codec-no-ci-workflow FOLLOWUP).
    name: test (ms-codec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo test -p ms-codec
        run: cargo test -p ms-codec

  clippy-ms-codec:
    name: clippy (ms-codec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo clippy -p ms-codec --all-targets -- -D warnings
        # No --all-features: ms-codec has no [features] table.
        run: cargo clippy -p ms-codec --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Show ulimit -l (diagnostic)
        run: ulimit -l || true

      - name: cargo build --tests
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ulimit -l 65536 || true
          fi
          cargo build --tests -p ms-cli

      - name: cargo test (default tests; G2.1 #[ignore]-gated)
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ulimit -l 65536 || true
          fi
          cargo test -p ms-cli

      - name: G2.1 eperm fault injection (fresh subprocess; env set before cargo)
        # Per Cycle B SPEC §4 P2 + toolkit Phase 2 plan: cfg(test) FAIL_MODE
        # injection is only reachable from the bin's test build (cfg(test) is
        # per-crate-not-per-build, RFC 1604). G2.1 is #[ignore]-gated and
        # filtered to the specific test name so the OnceLock<FailMode>
        # initializes fresh from MNEMONIC_TEST_MLOCK_FAIL_MODE in this step's
        # env. ms-cli has no [[lib]] target — invoke via --bin ms.
        env:
          MNEMONIC_TEST_MLOCK_FAIL_MODE: "eperm"
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ulimit -l 65536 || true
          fi
          cargo test -p ms-cli --bin ms mlock::tests::g2_1 -- --include-ignored

      - name: G2.3-debug einval debug_assert (fresh subprocess)
        # Per Cycle B SPEC §6 G2.3: debug builds trip debug_assert when
        # mlock returns EINVAL under fault injection.
        # #[should_panic(expected = "EINVAL")] asserts the panic message
        # contains the substring.
        env:
          MNEMONIC_TEST_MLOCK_FAIL_MODE: "einval"
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ulimit -l 65536 || true
          fi
          cargo test -p ms-cli --bin ms mlock::tests::g2_3 -- --include-ignored

      - name: G2.4 off control (fresh subprocess)
        # Per Cycle B SPEC §6 G2.4: control case — FAIL_MODE=off must not
        # synthesize failures. Verifies the wrapper does not increment
        # failure_count spuriously in a healthy ulimit environment.
        # NOTE: bare 'off' in YAML 1.1 is a boolean false; quote to force
        # string interpretation (toolkit workflow first observed this at
        # run 25834458333 on 2026-05-14; mirror the defense here).
        env:
          MNEMONIC_TEST_MLOCK_FAIL_MODE: "off"
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ulimit -l 65536 || true
          fi
          cargo test -p ms-cli --bin ms mlock::tests::g2_4 -- --include-ignored

  test-release-mlock-einval:
    # Cycle B Phase 3a (mirror in ms-cli at PE) — release-build coverage
    # for G2.3 EINVAL soft-fail. Per SPEC §6 G2.3 release branch: in
    # release builds the debug_assert is compiled out, so EINVAL injection
    # must soft-fail (record_failure) rather than panic. The
    # g2_3_einval_release_soft_fails test (inline-copied from toolkit
    # mlock.rs) asserts failure_count > 0 and first_errno == EINVAL.
    # Linux-only because the release-build-coverage gate is sufficient on
    # one platform; the cfg(test) FAIL_MODE branch is platform-uniform.
    name: "test (release, ubuntu-latest, mlock einval)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show ulimit -l (diagnostic)
        run: ulimit -l || true
      - name: G2.3-release einval soft-fail
        env:
          MNEMONIC_TEST_MLOCK_FAIL_MODE: "einval"
        run: |
          ulimit -l 65536 || true
          cargo test --release -p ms-cli --bin ms mlock::tests::g2_3 -- --include-ignored

  miri:
    name: miri (mlock unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + miri component
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: "cargo +nightly miri test mlock::"
        # Per Cycle B SPEC §6 G4.b: Miri verifies the Rust-side safety of
        # mlock's 2 unsafe blocks (libc::mlock in pin_pages_for;
        # libc::munlock in PinnedPageRange::drop). cfg(miri) shims stub the
        # syscalls. ms-cli is binary-only; invoke via --bin ms.
        run: "cargo +nightly miri test -p ms-cli --bin ms mlock::"

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: conformance-vector checksum pin
        run: cd design && sha256sum -c display-grouping-vectors.tsv.sha256

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -p ms-cli -- -D warnings

  history-purge:
    # **THE PURGE RECIPES ARE RUN, NOT DESCRIBED.** P2's argv refusal ends with a
    # recipe for removing the leaked line from shell history, and the defect class
    # it warns about is precisely *a remedy that reports success and purges
    # nothing* -- `history -d` on zsh prints timestamps, and `sed -i` alone edits a
    # file the entry has not reached yet. So the gate runs the emitted recipe
    # inside a real interactive shell on a pty and requires the entry gone, with a
    # control that plants the entry and purges nothing.
    #
    # WHY THE TESTS ARE `#[ignore]`-GATED AND THIS JOB EXISTS. A pty-driven
    # interactive zsh is not portable across the `test` matrix (macOS, and
    # aarch64-musl under QEMU), and `script(1)`'s arguments differ between GNU and
    # BSD. Same pattern the g6 and mlock fault-injection gates already use here: the
    # tests are opted IN by a dedicated job that provides the environment. They are
    # written to FAIL rather than skip when a shell is missing -- a skip prints ok
    # and exit 0, which is how an unrun gate passes for months.
    #
    # THE EXACT PATHS ARE ASSERTED, NOT THE PACKAGE NAMES. An install that succeeds
    # while placing a binary somewhere else fails identically to no install at all,
    # one CI round later. The tests hard-code /usr/bin/<shell>, so that is what is
    # checked. (mnemonic-engrave's CI went red the first time it saw these tests for
    # exactly this reason, and this is the fix that worked there.)
    name: "history purge (recipes RUN under real shells)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the shells the purge gates execute
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          for b in /usr/bin/zsh /usr/bin/bash /usr/bin/fish /usr/bin/script; do
            test -x "$b" || { echo "MISSING: $b"; exit 1; }
            echo "ok $b"
          done
          /usr/bin/zsh --version
          /usr/bin/bash --version | head -1
          /usr/bin/fish --version
      - name: cargo test --test history_purge -- --include-ignored
        run: cargo test -p ms-cli --test history_purge -- --include-ignored

  g6-invariant:
    # Cycle B SPEC §6 G6 — cross-repo mlock.rs inline-copy invariant.
    # Checks out the sibling repo (mnemonic-toolkit) to a known runner
    # path, then runs `tests/mlock_g6_invariant.rs` which asserts the
    # normalized source of ms-cli's `crates/ms-cli/src/mlock.rs` and
    # toolkit's `crates/mnemonic-toolkit/src/mlock.rs` are byte-equal
    # across the diff manifest plus name-export parity. Test pulls the
    # sibling path from $SIBLING_REPO_PATH.
    name: "g6 invariant (cross-repo mlock.rs)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout own (mnemonic-secret)
        uses: actions/checkout@v4
        with:
          path: mnemonic-secret
      - name: Checkout sibling (mnemonic-toolkit)
        uses: actions/checkout@v4
        with:
          repository: bg002h/mnemonic-toolkit
          ref: master
          path: mnemonic-toolkit
      - name: cargo test --test mlock_g6_invariant
        env:
          SIBLING_REPO_PATH: ${{ github.workspace }}/mnemonic-toolkit
        working-directory: mnemonic-secret
        # G6 tests are #[ignore]-gated to keep the default `cargo test`
        # step (which has no SIBLING_REPO_PATH set + no sibling checkout)
        # from invoking them. --include-ignored opts them in for this job
        # which DOES have both.
        run: cargo test -p ms-cli --test mlock_g6_invariant -- --include-ignored

  freebsd-compile-gate:
    # Cycle C — FreeBSD compile-gate. Catches the day a Linux-only syscall /
    # cfg / crate breaks the `cargo install`-on-FreeBSD path, and compile-covers
    # the BSD secret-hygiene arm in `src/process_hardening.rs`
    # (procctl/setrlimit). `x86_64-unknown-freebsd` is Tier 2 with Host Tools,
    # so `rustup target add` ships a precompiled std on the ubuntu runner; no
    # apt cross-compiler step is needed (cargo check stops before link; the only
    # C step is the vendored libsecp256k1 cc compile, which builds against the
    # Tier-2 std — validated locally with bare rustup). Fallback if that ever
    # needs a freebsd sysroot: switch to `cross check --target …` (cross-rs
    # bundles a freebsd container).
    #
    # CRITICAL — this MUST be a WHOLE-CRATE check (`cargo check --target …`),
    # NEVER `--lib`. ms-cli is a BIN-ONLY crate (`[[bin]] name = "ms"`, no
    # `src/lib.rs`); its `process_hardening` lives only in the bin target
    # (`mod process_hardening;` in `main.rs`). A `cargo check --lib` would
    # compile nothing relevant and give silent false-green coverage of the
    # entire BSD hardening arm. Only the bare whole-crate check reaches
    # `main.rs` and therefore the hardening module. (The toolkit's `--lib` row
    # is a special case that works only because the toolkit alone declares
    # `process_hardening` as `pub mod` in `src/lib.rs`.)
    #
    # Security note: this job uses only GitHub-provided trusted context. No
    # interpolation of untrusted user input.
    name: freebsd compile-gate (whole-crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-freebsd
      - run: cargo check --target x86_64-unknown-freebsd -p ms-cli

  musl-check:
    # musl target coverage (static air-gapped binary cycle). Both musl targets
    # are Tier 2 with Host Tools and `unix` + Linux, so every `#[cfg(unix)]` /
    # `#[cfg(target_os = "linux")]` path (mlock, process_hardening) compiles +
    # is functional on musl with ZERO source change.
    #
    #   * x86_64-musl — built + tested natively (`cargo test -p ms-cli`). Needs
    #     `musl-tools` (`musl-gcc`) + `CC_x86_64_unknown_linux_musl=musl-gcc` so
    #     cc-rs builds the ONLY C dep (the vendored libsecp256k1 in
    #     `secp256k1-sys`) against musl. Honors the `ulimit -l 65536` dance
    #     (mlock tests). ms-cli is bin-only — `-p ms-cli` covers the bin's test
    #     build.
    #   * aarch64-musl — `cross test` under QEMU user-mode emulation (cross
    #     bundles the musl cross C toolchain AND the qemu-aarch64 runner). This
    #     RUNS the package test suite on aarch64-Linux so the ms1/encode/decode
    #     golden vectors are output-verified for the shipped aarch64 binary, not
    #     merely compiled. The lib `mlock::tests::*` are SKIPPED here
    #     (`-- --skip mlock`): they are POSIX-`mlock(2)` syscall + runtime-
    #     page-size gates (`g4_a` asserts a 64-byte buf pins exactly 1 page),
    #     not meaningfully testable under QEMU (qemu-user forwards `mlock` to
    #     the host kernel inside the cross container, which can EPERM under the
    #     container RLIMIT_MEMLOCK; emulated page size / heap alignment can also
    #     differ), and mlock behavior is not this job's target — the goldens
    #     are. No `--include-ignored`, so the `g2_*` fault-injection tests stay
    #     skipped. ms-cli has no `tests/mlock_unit.rs` G1.x integration binary
    #     (unlike mnemonic-toolkit), so a single `--skip mlock` is sufficient;
    #     the `mlock_g6_invariant` integration test is `#[ignore]`-gated (g6
    #     job) and already off by default.
    #
    # crt-static left at its musl default (ON). NEVER pass
    # `-Ctarget-feature=-crt-static` (rust#135244 silently links host glibc).
    # Toolchain pinned `@1.85.0` (matches `rust-toolchain.toml`).
    #
    # Security note: this job uses only GitHub-provided trusted context.
    name: musl compile/test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            musl_native: true
          - target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: install musl-tools (x86_64-musl native)
        if: ${{ matrix.musl_native }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: install cross (aarch64-musl)
        if: ${{ matrix.cross }}
        run: cargo install --locked cross
      # Register QEMU/binfmt_misc for aarch64 so `cross test` tests that spawn
      # the binary as a subprocess (raw std::Command) don't hit ENOEXEC
      # ("Exec format error") — cross/QEMU only auto-translates the test
      # harness, not children it forks, unless binfmt_misc is registered.
      - name: register binfmt (qemu) for aarch64 subprocess exec
        if: ${{ matrix.cross }}      # only the aarch64 cross leg, NOT x86_64-native
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: cargo test -p ms-cli --target x86_64-musl (native)
        if: ${{ matrix.musl_native }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          ulimit -l 65536 || true
          cargo test -p ms-cli --target ${{ matrix.target }}
      # Run the package test suite on aarch64-Linux under QEMU user-mode so the
      # ms1/encode/decode golden vectors are OUTPUT-verified for the shipped
      # aarch64 binary. `--skip mlock` drops the lib `mlock::tests::*` POSIX-
      # syscall / page-size gates (untestable-meaningfully under emulation);
      # every golden/integration test still runs. No `--include-ignored`, so
      # the `g2_*` fault-injection tests stay skipped.
      - name: cross test -p ms-cli --target aarch64-musl (QEMU; goldens, mlock skipped)
        if: ${{ matrix.cross }}
        run: cross test --release -p ms-cli --target ${{ matrix.target }} -- --skip mlock
